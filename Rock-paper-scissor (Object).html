<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#1f2937;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:#374151;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,.5);
}

h1{
    margin-bottom:20px;
}

.buttons{
    margin:20px 0;
}

button{
    font-size:40px;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

#result{
    margin:20px;
    font-size:25px;
    font-weight:bold;
}

.score{
    margin-top:20px;
    line-height:2;
}

.reset{
    margin-top:20px;
    padding:10px 20px;
    font-size:16px;
    border-radius:8px;
    background:#ef4444;
    color:white;
}
</style>

</head>
<body>

<div class="container">

<h1>Rock Paper Scissors</h1>

<div class="buttons">
<button onclick="playGame('rock')">✊</button>
<button onclick="playGame('paper')">✋</button>
<button onclick="playGame('scissors')">✌️</button>
</div>

<h2 id="result">Choose your move!</h2>

<p id="moves"></p>

<div class="score">
<h3>Wins : <span id="wins">0</span></h3>
<h3>Losses : <span id="losses">0</span></h3>
<h3>Ties : <span id="ties">0</span></h3>
</div>

<button class="reset" onclick="resetScore()">Reset Score</button>

</div>

<script>

let score = JSON.parse(localStorage.getItem("score")) || {
    wins:0,
    losses:0,
    ties:0
};

updateScore();

function playGame(playerMove){

    const computerMove = pickComputerMove();

    let result="";

    if(playerMove==="rock"){

        if(computerMove==="rock"){
            result="Tie";
            score.ties++;
        }
        else if(computerMove==="paper"){
            result="You Lose";
            score.losses++;
        }
        else{
            result="You Win";
            score.wins++;
        }

    }

    else if(playerMove==="paper"){

        if(computerMove==="paper"){
            result="Tie";
            score.ties++;
        }
        else if(computerMove==="scissors"){
            result="You Lose";
            score.losses++;
        }
        else{
            result="You Win";
            score.wins++;
        }

    }

    else{

        if(computerMove==="scissors"){
            result="Tie";
            score.ties++;
        }
        else if(computerMove==="rock"){
            result="You Lose";
            score.losses++;
        }
        else{
            result="You Win";
            score.wins++;
        }

    }

    localStorage.setItem("score",JSON.stringify(score));

    document.getElementById("result").innerHTML=result;

    document.getElementById("moves").innerHTML=
    `You chose <b>${playerMove}</b> | Computer chose <b>${computerMove}</b>`;

    updateScore();

}

function pickComputerMove(){

    const random=Math.random();

    if(random<1/3){
        return "rock";
    }

    else if(random<2/3){
        return "paper";
    }

    return "scissors";

}

function updateScore(){

    document.getElementById("wins").innerHTML=score.wins;
    document.getElementById("losses").innerHTML=score.losses;
    document.getElementById("ties").innerHTML=score.ties;

}

function resetScore(){

    score={
        wins:0,
        losses:0,
        ties:0
    };

    localStorage.removeItem("score");

    updateScore();

    document.getElementById("result").innerHTML="Choose your move!";
    document.getElementById("moves").innerHTML="";

}

</script>

</body>
</html>
