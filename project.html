<!DOCTYPE html>
<html>
<head>
    <title>Volunteer Yatra</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
.navbar{
    position:relative;
    width:100%;
    height:100px;
    background:white;
    border-bottom:1px solid #eee;
}

.logo img{
    width:250px;
}

body{
    position:relative;
    width:100%;
    height:100vh;
}



.navbar{
    position:relative;
    width:100%;
    height:80px;
}

.logo{
    position:absolute;
    left:50px;
    top:25px;
    font-size:28px;
    font-weight:bold;
}

.menu{
    position:absolute;
    left:400px;
    top:30px;
}

.menu a{
    text-decoration:none;
    color:black;
    margin-right:40px;
}

.login{
    position:absolute;
    right:60px;
    top:30px;
    font-weight:bold;
}

/* Hero Section */

.hero{
    position:relative;
    width:100%;
    height:600px;
}

/* Left Side */

.left-content{
    position:absolute;
    left:80px;
    top:80px;
    width:500px;
}

.left-content h3{
    margin-bottom:15px;
}

.left-content h1{
    font-size:50px;
    line-height:1.3;
}

.left-content p{
    margin-top:20px;
    color:gray;
    line-height:1.8;
}

.left-content button{
    margin-top:25px;
    padding:12px 25px;
    background:gold;
    border:none;
    border-radius:5px;
}

.right-image{
    position:absolute;
    right:80px;
    top:80px;
    width:450px;
}

.right-image img{
    width:100%;
    border-radius:20px;
}
    </style>
</head>
<body>

    <div class="navbar">
       <div class="navbar">

    <div class="logo">
        <img src="https://volunteeryatra.com/assets/images/Logo.png" alt="Volunteer Yatra Logo">
    </div>

        <div class="menu">
            <a href="#">About</a>
            <a href="#">Opportunities</a>
            <a href="#">Contact Us</a>
        </div>

        <div class="login">Login</div>
    </div>

    <div class="hero">

        <div class="left-content">
            <h3>Our Vision</h3>

            <h1>
                Welcome to <b>Volunteer Yatra</b>,
                Your Gateway to Impactful Volunteer Travel.
            </h1>

            <p>
                Join Volunteer Yatra, where every journey is an
                opportunity to volunteer, travel and contribute
                to positive global change.
            </p>

            <button>Join Us →</button>
        </div>

        <div class="right-image">
            <img src="https://volunteeryatra.com/assets/images/about-us/about-hero.svg" alt="image">
        </div>

    </div>

</body>
</html>
